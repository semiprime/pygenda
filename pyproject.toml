[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8"]


[project]
name = "pygenda"
version = "0.3.10-dev0"
authors = [
    { name="Matthew Lewis", email="pygenda@semiprime.com" },
]
license = "GPL-3.0-only"
license-files = [ "COPYING" ]
description = "An agenda application inspired by Agenda programs on Psion PDAs."
readme = "description.md"
keywords = [ "calendar", "agenda", "todolist", "diary", "pda", "psion", "geminipda", "cosmocommunicator", "linux-mobile" ]

requires-python = ">=3.5"
dependencies = [
    "PyGObject",
    "python-dateutil",
    "icalendar",
    "tzlocal!=2.*", # Gemian on GeminiPDA does not work with tzlocal 2.x
    "num2words",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Handhelds/PDA's",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]


[tool.setuptools]
package-dir = { "pygenda" = "pygenda" }
exclude-package-data = { "*" = ["mypy.ini", "*.pot", "*.po"] }

[tool.setuptools_scm]

[project.urls]
"Homepage (Codeberg)" = "https://codeberg.org/semiprime/pygenda"
"Homepage (GitHub)" = "https://github.com/semiprime/pygenda"
